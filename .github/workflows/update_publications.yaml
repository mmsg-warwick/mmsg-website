name: Update Publications

on:
  schedule:
    - cron: "0 7 * * 1"  # every Monday at 7am UTC
  workflow_dispatch:  # allow running it by hand from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Fetch publications from Zotero
        run: python3 scripts/update_publications.py
        env:
          ZOTERO_LIBRARY_TYPE: ${{ vars.ZOTERO_LIBRARY_TYPE }}
          ZOTERO_LIBRARY_ID: ${{ vars.ZOTERO_LIBRARY_ID }}
          ZOTERO_COLLECTION_KEY: ${{ vars.ZOTERO_COLLECTION_KEY }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}

      - name: Open pull request if publications changed
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          branch: update-publications
          delete-branch: true
          commit-message: "update publications from Zotero"
          title: "Update publications from Zotero"
          body: |
            Automated update of `data/publications.json` from the Zotero collection.

            Review the changes and check the Netlify deploy preview before merging.
          labels: publications
          add-paths: data/publications.json
